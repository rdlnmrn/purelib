nd executable? More than one might expect. The main change is not that approximation replaces mathematics, but that a finite request and its checkable evidence replace a presumed completed infinity.`}),(0,S.jsx)(`p`,{className:`reading-note`,children:`This is an explanatory essay, not the specification. Links in the margin of the argument lead to the corresponding Lean declarations.`}),(0,S.jsx)(`p`,{className:`reading-note`,children:`The interactive demonstrations have not been properly tested. Their behaviour and numerical displays may contain errors; consult the linked Lean proofs for the formal results.`})]}),(0,S.jsxs)(`section`,{className:`prose-section`,id:`finite-requests`,children:[(0,S.jsx)(`p`,{className:`section-number`,children:`1`}),(0,S.jsx)(`h2`,{children:`Finite requests in place of completed values`}),(0,S.jsxs)(`p`,{children:[`The primitive data are deliberately ordinary: integers; fractions with positive denominators; pairs of fractions for Gaussian rationals; finite lists and finite trees; decidable predicates; and records carrying explicit witnesses. A projective value is a pair `,(0,S.jsx)(`code`,{children:`[p:q]`}),`. When `,(0,S.jsx)(`code`,{children:`q ≠ 0`}),` it denotes the affine value `,(0,S.jsx)(`code`,{children:`p/q`}),`, while `,(0,S.jsx)(`code`,{children:`[1:0]`}),` records the point at infinity. Two pairs represent the same value when cross multiplication says so. Nothing in this representation asks us to construct a quotient space or a completed complex plane.`]}),(0,S.jsx)(`p`,{children:`A general number-like process is therefore not introduced as an infinite digit sequence. It is an interface that answers any supplied finite request: give a positive rational tolerance, or ask for a finite number of bits, and it returns finite output together with a rational enclosure. A later request may refine the same stored state and extend the old word. “Arbitrary accuracy” means that each such finite request has a finite answer; it does not mean that all answers have already been assembled into an infinite object.`}),(0,S.jsx)(`aside`,{className:`margin-note`,children:`One could use the successive prefixes as intuition for a real number, but this development does not formalize the completed sequence. The finite request process is the object being used.`}),(0,S.jsx)(`p`,{children:`This costs some familiar shortcuts. One cannot simply choose an element from an unspecified nonempty set, pass silently to a limit, or decide equality of arbitrary completed reals. In exchange, positive assertions have computational content: division asks for evidence that zero has been excluded, logarithms carry branch data, and existence theorems return witnesses which can actually be inspected.`}),(0,S.jsx)(Qc,{href:`../../CCL/Geometry/Projective.lean`,children:`The finite projective core`})]}),(0,S.jsxs)(`section`,{className:`prose-section`,id:`encoding`,children:[(0,S.jsx)(`p`,{className:`section-number`,children:`2`}),(0,S.jsx)(`h2`,{children:`The CCL word and the region it describes`}),(0,S.jsxs)(`p`,{children:[`Put `,(0,S.jsx)(`code`,{children:`γ = 1 + i`}),`. A regular CCL block has the binary form`,(0,S.jsxs)(`code`,{children:[`[k,s] = 1`,(0,S.jsx)(`sup`,{children:`k`}),`0 β(s)`]}),`. The unary prefix records a scale by a power of γ; the final three bits choose one of eight representatives`,(0,S.jsx)(`code`,{children:`0, …, 7`}),` arranged as the compass directions E, NE, N, NW, W, SW, S, and SE. There is also a specially marked low-scale block, permitted only at the beginning of a word.`]}),(0,S.jsxs)(`div`,{className:`sector-table`,children:[(0,S.jsxs)(`div`,{children:[(0,S.jsx)(`span`,{children:`E`}),(0,S.jsx)(`code`,{children:`000`}),(0,S.jsx)(`span`,{children:`NE`}),(0,S.jsx)(`code`,{children:`001`}),(0,S.jsx)(`span`,{children:`N`}),(0,S.jsx)(`code`,{children:`010`}),(0,S.jsx)(`span`,{children:`NW`}),(0,S.jsx)(`code`,{children:`011`})]}),(0,S.jsxs)(`div`,{children:[(0,S.jsx)(`span`,{children:`W`}),(0,S.jsx)(`code`,{children:`100`}),(0,S.jsx)(`span`,{children:`SW`}),(0,S.jsx)(`code`,{children:`101`}),(0,S.jsx)(`span`,{children:`S`}),(0,S.jsx)(`code`,{children:`110`}),(0,S.jsx)(`span`,{children:`SE`}),(0,S.jsx)(`code`,{children:`111`})]})]}),(0,S.jsxs)(`p`,{children:[`The controller scales a nonzero Gaussian rational into the annulus`,(0,S.jsx)(`code`,{children:`1 ≤ |z|² ≤ 2`}),`, selects its sector using rational comparisons with`,(0,S.jsx)(`code`,{children:`±1/2`}),`, subtracts the representative, and inverts. On projective pairs these operations are transparent two-by-two matrices. Exact Gaussian rationals have terminating encodings, and their finite decoders reconstruct them exactly.`]}),(0,S.jsxs)(`p`,{children:[`A prefix says rather more than “these are the first few digits.” It describes a projective cylinder: the region of all tails which still satisfy its completed block constraints. The formal development never gathers all compatible values into a global set. It reasons from a finite witness of compatibility. After`,(0,S.jsx)(`em`,{children:`n`}),` completed blocks, any two witnessed compatible values have squared chordal separation at most `,(0,S.jsxs)(`code`,{children:[`2`,(0,S.jsx)(`sup`,{children:`−n`})]}),`.`]}),(0,S.jsx)(Qc,{href:`../../CCL/Encoding/Decoder.lean`,children:`Block syntax and decoder matrices`}),(0,S.jsx)(Pc,{})]}),(0,S.jsxs)(`section`,{className:`prose-section`,id:`family`,children:[(0,S.jsx)(`p`,{className:`section-number`,children:`3`}),(0,S.jsx)(`h2`,{children:`Related finite encodings`}),(0,S.jsx)(`p`,{children:`CCL is easier to place after looking at three relatives. An ordinary continued fraction uses integer digits and Euclidean descent. A continued logarithm replaces those digits by binary scale choices. A coordinate-floor complex continued fraction repeatedly folds a point back into a half-open unit square. CCL combines the binary scale idea with eight rationally decidable complex directions.`}),(0,S.jsx)(`p`,{children:`The experiments below are intentionally modest. Their inputs are displayed rationals, their loops have finite descent measures, and the graphics are aids to reading those finite algorithms. They do not simulate an unbounded stream.`}),(0,S.jsx)(Vc,{})]}),(0,S.jsxs)(`section`,{className:`prose-section`,id:`refinement`,children:[(0,S.jsx)(`p`,{className:`section-number`,children:`4`}),(0,S.jsx)(`h2`,{children:`Refinement and arithmetic`}),(0,S.jsxs)(`p`,{children:[`The cylinder estimate supplies a simple universal precision budget. If one wants squared chordal spread below a positive rational ε, a finite search finds`,(0,S.jsx)(`em`,{children:`n`}),` with `,(0,S.jsxs)(`code`,{children:[`2`,(0,S.jsx)(`sup`,{children:`−n`}),` < ε`]}),`. Particular scale blocks may contract more strongly, and a bounded affine chart turns the projective statement into a rational box estimate with an explicit conversion factor.`]}),(0,S.jsx)(Hc,{}),(0,S.jsx)(`p`,{children:`Rational boxes are the working currency for subsequent analysis. Addition, subtraction and multiplication transport them directly; division additionally requires a finite certificate separating the denominator from zero. Persistent transducers answer each request with ordinary CCL bits and an accuracy sidecar obtained from the same refined state. Coherence records that a later answer really extends what was said earlier.`}),(0,S.jsx)(`p`,{children:`The same pattern supports more than field arithmetic. The library contains finite-request exponential, positive-real logarithm and charted complex logarithm, sine and cosine, with operational algebraic laws. Its calculus uses divided differences, finite jets, Taylor remainder budgets, finite polynomial integration, and rational path refinement. Polynomial roots and poles are isolated by finite winding certificates and rational boxes; the Paper-I interface remains independent of CCL, while a one-way CCL-2 bridge may attach persistent prefixes afterwards.`}),(0,S.jsxs)(`div`,{className:`source-list`,"aria-label":`Selected formal sources`,children:[(0,S.jsx)(Qc,{href:`../../CCL/Arithmetic/BoxedNameProcess.lean`,children:`Boxed arithmetic`}),(0,S.jsx)(Qc,{href:`../../CCL/Transcendental/Output.lean`,children:`Transcendental outputs`}),(0,S.jsx)(Qc,{href:`../../CCL/Calculus/DividedDifference.lean`,children:`Finite calculus`}),(0,S.jsx)(Qc,{href:`../../RFAP/Paper.lean`,children:`RFAP root isolation`})]})]}),(0,S.jsxs)(`section`,{className:`prose-section`,id:`measure`,children:[(0,S.jsx)(`p`,{className:`section-number`,children:`5`}),(0,S.jsx)(`h2`,{children:`Measure theory on explicit finite laws`}),(0,S.jsxs)(`p`,{children:[`In this regime measure theory does indeed begin to resemble a careful remix of finite combinatorics. A law is a displayed finite list of outcomes with nonnegative rational weights. An event is a decidable predicate on those outcomes. Integration is a weighted finite sum. “AE” means `,(0,S.jsx)(`em`,{children:`almost everywhere`}),`: two functions agree away from a displayed collection of atoms whose total weight is zero. Conditioning is division by the positive rational weight of an event or a finite partition cell.`]}),(0,S.jsx)(Zc,{}),(0,S.jsxs)(`p`,{children:[`These primitives retain the algebraic heart of a surprising fraction of an introductory course: finite additivity and monotonicity; indicator functions and expectation; variance and covariance; Markov and Chebyshev inequalities; Jensen for the finite convexity notions in use; conditional expectation on finite partitions; total expectation and total variance; finite kernels, stationarity, and return or maximal bounds; densities and finite Radon–Nikodym and Lebesgue decomposition statements; and root-free powered L`,(0,S.jsx)(`sup`,{children:`p`}),` geometry.`]}),(0,S.jsxs)(`p`,{children:[`What has disappeared is exactly the machinery whose force comes from completed infinity: σ-algebras closed under countable unions, countable additivity, monotone and dominated convergence for arbitrary sequences, completion of L`,(0,S.jsx)(`sup`,{children:`p`}),`spaces, product constructions over infinitely many coordinates, and asymptotic ergodic theorems. Finite analogues can be strong and quantitative, but they do not become those theorems merely by suggestive notation.`]}),(0,S.jsx)(`p`,{children:`CCL prefixes fit this finite theory naturally. A completed prefix is a finite observable with a dyadic word weight and a certified geometric diameter. Any finite law supported by witnessed points in one cylinder inherits explicit expectation enclosures, variance bounds, and exact zero probability outside a computable prefix radius.`}),(0,S.jsxs)(`div`,{className:`source-list`,children:[(0,S.jsx)(Qc,{href:`../../FiniteMeasure.lean`,children:`Finite-measure theorem index`}),(0,S.jsx)(Qc,{href:`../../CCL/Measure/CylinderConcentration.lean`,children:`CCL cylinder concentration`})]})]}),(0,S.jsxs)(`section`,{className:`prose-section`,id:`approximation`,children:[(0,S.jsx)(`p`,{className:`section-number`,children:`6`}),(0,S.jsx)(`h2`,{children:`Best approximation to rational anchors`}),(0,S.jsxs)(`p`,{children:[`A finite root-isolation request returns a rational box and a rational anchor. The approximation development can enumerate a nonempty finite table containing all and only the Gaussian-rational best approximants to that displayed anchor. From adjacent occupied best levels, a coefficient-local finite search returns the next occupied level and skips none; it emits only a genuinely consecutive best pair, or reports exact termination. Its candidate list has the explicit quadratic bound`,(0,S.jsx)(`code`,{children:`64(B+1)²`}),`.`]}),(0,S.jsxs)(`p`,{children:[`There is also a Chevallier-style finite global boundary. For each displayed rational source and each natural squared-denominator request above one, a global selector returns a bounded nonzero denominator satisfying the formal rational-cut error bound. Separate positive rational boxes give arbitrarily late `,(0,S.jsx)(`em`,{children:`finite`}),`counterexample runs against every strictly sharper permitted cut. This is a finite global and finite sharpness statement, not an asymptotic assertion about an already completed irrational root.`]}),(0,S.jsx)(`aside`,{className:`margin-note`,children:`At every root-track request, the “best approximation” theorem applies exactly to the rational anchor in that response. A finer request produces a finer anchor and a new verified finite best-approximation calculation. The polynomial residual and root box are maintained separately.`}),(0,S.jsxs)(`div`,{className:`source-list`,children:[(0,S.jsx)(Qc,{href:`../../RFAP/Approximation/RATBestApproximation.lean`,children:`RAT best-response interface`}),(0,S.jsx)(Qc,{href:`../../RFAP/Approximation/LocalSuccessor.lean`,children:`Local successor theorem`}),(0,S.jsx)(Qc,{href:`../../RFAP/Approximation/FiniteDirichletGlobal.lean`,children:`Finite global boundary`})]})]}),(0,S.jsxs)(`section`,{className:`prose-section boundaries`,id:`boundaries`,children:[(0,S.jsx)(`p`,{className:`section-number`,children:`7`}),(0,S.jsx)(`h2`,{children:`The boundary of the claim`}),(0,S.jsx)(`p`,{children:`The development asserts executable finite constructions over explicit arithmetic. It proves a finite response for every supplied positive rational accuracy and bit-count request, and the response comes with kernel-checked specifications. It does not postulate a completed infinite digit stream, a global set of all points in a cylinder, or an ambient space obtained by completion.`}),(0,S.jsx)(`p`,{children:`Accordingly, compactness, infinite series, unrestricted countable choice, and asymptotic limit arguments are not hidden behind familiar terminology. Nor is uncertified division by a possibly zero quantity, or a complex logarithm without branch information. The point is not that finite mathematics secretly proves every classical theorem. It is that many useful conclusions can be stated in the form actually needed by a calculation, and proved with arguments whose witnesses survive extraction.`})]}),(0,S.jsxs)(`footer`,{className:`article-footer`,children:[(0,S.jsx)(`h2`,{children:`Reading the formal source`}),(0,S.jsxs)(`p`,{children:[`The commented `,(0,S.jsxs)(`a`,{href:`../../CCL/Paper.lean`,children:[(0,S.jsx)(`code`,{children:`CCL.Paper`}),` facade`]}),` is the shortest map of the public results. The three exact encodings are collected in`,(0,S.jsx)(`a`,{href:`../../CCL/Encoding/Examples.lean`,children:(0,S.jsx)(`code`,{children:` CCL.Encoding.Examples`})}),`. For the architecture, build instructions and paper boundary, continue with the`,(0,S.jsx)(`a`,{href:`../../README.md`,children:` repository README`}),`. The linked Lean declarations, rather than this informal prose, are the authority for formal claims.`]})]})]})})]})}(0,v.createRoot)(document.getElementById(`root`)).render((0,S.jsx)(_.StrictMode,{children:(0,S.jsx)($c,{})}))})();</script>
