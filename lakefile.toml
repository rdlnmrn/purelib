name = "purelib"
version = "1.0.0"
# Use Lean 4.32.2 built-in linting; no additional driver or dependency is needed.
builtinLint = true
defaultTargets = [
  "Purelib",
  "CCLPublication",
  "RFAPPublication",
  "RFAP2Publication",
  "DivineProportionsPublication",
  "RationalRotationsPublication",
  "MinkowskiRotationsPublication",
  "PurelibExamples",
  "Test",
  "CCLExamples",
  "DivineProportionsExamples",
  "RationalRotationsExamples",
  "IntegrationCheckpointIO",
  "RootStateCheckpointIO",
  "CenterCheckpointIO",
  "RootRefinementCheckpointIO",
  "QuadraticSampleCheckpointIO",
  "DiameterPreparationCheckpointIO",
  "InitialExtractionCheckpointIO",
  "SquareRootFamilyCheckpointIO",
  "PreparedBankCheckpointIO",
  "PreparedCycleCheckpointIO",
  "PreparedCenterCheckpointIO",
  "NanodaExport",
  "canonical_isolation_checkpoint_harness",
  "fraction_regression",
  "unreserved_sharpness_regression",
  "canonical_pilot_benchmark",
  "scalar_gcd_benchmark",
  "legendre_replay_harness",
  "integration_replay_regression",
  "integration_checkpoint_harness",
  "quadratic_refinement_harness",
  "square_factor_observation_harness",
  "initial_isolation_harness",
  "polynomial_period_observation_harness",
  "adaptive_prepared_banks_harness",
  "canonical_period_preparation_harness",
  "moving_reset_harness",
  "saved_root_refinement_harness",
  "prepared_source_replay_harness",
  "saved_forecast_harness",
  "saved_geometry_harness",
  "saved_boundary_harness",
  "finite_tasks_scheduling_harness",
  "standard_branch_geometry_harness",
  "json_regression",
  "polynomial_inverse_checkpoint_harness",
  "project_query_replay_observation",
]

# Load only the reviewed linter providers, without adding source imports.
# Native dependencies precede their consumers; keep this order at the pinned revision.
dynlibs = ["batteries/Batteries:shared"]
plugins = [
  "mathlib/+Mathlib.Tactic.Linter.DirectoryDependency:dynlib",
  "mathlib/+Mathlib.Tactic.Linter.Header:dynlib",
  "mathlib/+Mathlib.Tactic.DeclarationNames:dynlib",
  "mathlib/+Mathlib.Tactic.Linter.Style:dynlib",
  "mathlib/+Mathlib.Tactic.Linter.DeprecatedSyntaxLinter:dynlib",
  "mathlib/+Mathlib.Tactic.Linter.Whitespace:dynlib",
  "mathlib/+Mathlib.Tactic.Linter.DocString:dynlib",
  "mathlib/+Mathlib.Tactic.Linter.UnusedTacticExtension:dynlib",
  "mathlib/+Mathlib.Tactic.Linter.UnusedTactic:dynlib",
  "mathlib/+Mathlib.Tactic.Linter.Lint:dynlib",
]

# Weak options permit reviewed declaration-local exceptions and do not rebuild Mathlib.
# See docs/linting.md for scope and the conventions intentionally left opt-in.
# Name/value records support both an option and options below its name.
leanOptions = [
  { name = "weak.linter.unusedVariables", value = true },
  { name = "weak.linter.unusedSectionVars", value = true },
  { name = "weak.linter.missingDocs", value = true },
  { name = "weak.linter.unusedTactic", value = true },
  { name = "weak.linter.dupNamespace", value = true },
  { name = "weak.linter.style.nativeDecide", value = true },
  { name = "weak.linter.style.openClassical", value = true },
  { name = "weak.linter.style.maxHeartbeats", value = true },
  { name = "weak.linter.style.longLine", value = true },
  { name = "weak.linter.style.longLine.maxLineLength", value = 120 },
  { name = "weak.linter.style.whitespace", value = true },
  { name = "weak.linter.style.docString", value = true },
  { name = "weak.linter.style.docString.empty", value = true },
  { name = "weak.linter.style.setOption", value = true },
  { name = "weak.linter.style.nameCheck", value = true },
  { name = "weak.linter.unusedDecidableInType", value = false },
  { name = "weak.linter.unusedFintypeInType", value = false },
]

[[lean_lib]]
name = "Purelib"
roots = ["Purelib.Library", "Purelib.Measure", "Purelib.Riemann", "Purelib.Geometry.Rotations", "Purelib.Geometry", "Purelib.Curves"]
globs = ["Purelib.Library", "Purelib.Measure", "Purelib.Riemann", "Purelib.Geometry.Rotations", "Purelib.Geometry", "Purelib.Algebra.+", "Purelib.Approximation.+", "Purelib.CCL.+", "Purelib.Curves.+", "Purelib.Data.+", "Purelib.Elab.+", "Purelib.Geometry.+", "Purelib.Integration.+", "Purelib.LinearAlgebra.+", "Purelib.Measure.+", "Purelib.NumberTheory.+", "Purelib.Polynomial.+", "Purelib.RationalFunctions.+", "Purelib.Riemann.+", "Purelib.RootIsolation.+", "Purelib.Tactic.+", "Purelib.Topology.+", "Purelib.Calculus.+", "Purelib.Computation.+", "Purelib.Control.+", "Purelib.System.+", "Purelib.Logic.+", "Purelib.Physics.+", "Purelib.Curves"]

[[lean_lib]]
name = "CCLPublication"
roots = ["papers.CCL.CCL"]
globs = ["papers.CCL.CCL", "papers.CCL.Chapters.+"]

[[lean_lib]]
name = "RFAPPublication"
roots = ["papers.RFAP.RFAP"]
globs = ["papers.RFAP.RFAP", "papers.RFAP.Chapters.+"]

[[lean_lib]]
name = "RFAP2Publication"
roots = ["papers.RFAP.RFAP2"]
globs = ["papers.RFAP.RFAP2"]

[[lean_lib]]
name = "DivineProportionsPublication"
roots = ["formalisations.DivineProportions.DivineProportions"]
globs = ["formalisations.DivineProportions.DivineProportions", "formalisations.DivineProportions.Chapters", "formalisations.DivineProportions.Chapters.+"]

[[lean_lib]]
name = "RationalRotationsPublication"
roots = ["formalisations.RationalRotations.RationalRotations"]
globs = ["formalisations.RationalRotations.RationalRotations", "formalisations.RationalRotations.Chapters", "formalisations.RationalRotations.Chapters.+"]

[[lean_lib]]
name = "MinkowskiRotationsPublication"
roots = ["formalisations.MinkowskiRotations.MinkowskiRotations"]
globs = ["formalisations.MinkowskiRotations.MinkowskiRotations"]

[[lean_lib]]
name = "PurelibExamples"
roots = ["Purelib.Examples.All"]
globs = ["Purelib.Examples.+"]

[[lean_lib]]
name = "Test"
roots = ["Test.All"]
globs = ["Test.+"]

[[lean_lib]]
name = "CCLExamples"
roots = ["papers.CCL.Examples"]
globs = ["papers.CCL.Examples"]

[[lean_lib]]
name = "DivineProportionsExamples"
roots = ["formalisations.DivineProportions.Examples"]

[[lean_lib]]
name = "RationalRotationsExamples"
roots = ["formalisations.RationalRotations.Examples"]

[[lean_lib]]
name = "IntegrationCheckpointIO"
roots = ["scripts.checkpoint.Integration", "scripts.checkpoint.Integration.Import"]

[[lean_lib]]
name = "RootStateCheckpointIO"
# Reusable dependencies retain their Purelib library owner and arrive by import.
roots = ["scripts.checkpoint.RootState"]

[[lean_lib]]
name = "CenterCheckpointIO"
roots = ["scripts.checkpoint.Center"]

[[lean_lib]]
name = "RootRefinementCheckpointIO"
roots = ["scripts.checkpoint.RootRefinement"]

[[lean_lib]]
name = "QuadraticSampleCheckpointIO"
