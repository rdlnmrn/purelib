[[lean_lib]]
name = "InitialExtractionCheckpointIO"
roots = ["scripts.checkpoint.InitialExtraction"]

[[lean_lib]]
name = "SquareRootFamilyCheckpointIO"
roots = ["scripts.checkpoint.SquareRootFamily"]

[[lean_lib]]
name = "PreparedBankCheckpointIO"
roots = ["scripts.checkpoint.PreparedBank"]

[[lean_lib]]
name = "PreparedCycleCheckpointIO"
roots = ["scripts.checkpoint.PreparedCycle"]

[[lean_lib]]
name = "PreparedCenterCheckpointIO"
# Imported reusable modules belong to Purelib, including native library emission.
roots = ["scripts.checkpoint.PreparedCenter"]

