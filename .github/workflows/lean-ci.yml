name: Lean CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Restore only reusable artifacts, not profiling runs or old experiments.
      # The fallback retains the same dependencies and checked Core epoch.
      - name: Restore Lean and proof-check caches
        id: lean-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/packages
            .lake/build
            .lake/core-toolchain
            .lake/builtin-lint
            .lake/axiom-audit
            .lake/nanoda-tools
            .lake/nanoda-inputs
            .lake/nanoda-native
            .lake/nanoda-checked
            .lake/kernel-replay-tests
          key: checks-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'scripts/toolchain/**', 'scripts/lean_module_data/**') }}-${{ github.sha }}
          restore-keys: |
            checks-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'scripts/toolchain/**', 'scripts/lean_module_data/**') }}-

      - name: Install Lean and fetch Mathlib artifacts
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true

      - name: Check out independent Rust checker
        uses: actions/checkout@v4
        with:
          repository: ammkrn/nanoda_lib
          ref: 418320295890faed83a96fd97907b12a3b6728c2
          path: .external/nanoda

      - name: Restore Rust compiler and checker caches
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .external/nanoda -> target
          cache-workspace-crates: true
          key: nanoda-418320295890faed83a96fd97907b12a3b6728c2

      - name: Build independent Rust checker
        working-directory: .external/nanoda
        run: cargo build --release --locked

      - name: Run all completion checks
        env:
          NANODA_BIN: ${{ github.workspace }}/.external/nanoda/target/release/nanoda_bin
        run: ./scripts/check-all.sh

      # Save after the full checks populate their own validated checkpoints.
      # Never lock an incomplete run into the immutable key for this revision.
      - name: Save Lean and proof-check caches
        if: success() && steps.lean-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .lake/packages
            .lake/build
            .lake/core-toolchain
            .lake/builtin-lint
            .lake/axiom-audit
            .lake/nanoda-tools
            .lake/nanoda-inputs
            .lake/nanoda-native
            .lake/nanoda-checked
            .lake/kernel-replay-tests
          key: ${{ steps.lean-cache.outputs.cache-primary-key }}

      - name: Retain completion logs and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: completion-checks
          path: .lake/completion-checks/
          include-hidden-files: true
          if-no-files-found: ignore
